name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build and package
        shell: pwsh
        run: ./build/package.ps1 -Version "${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ExilesMonitorPanel
          path: |
            dist/*.zip
            dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @((Get-ChildItem dist/*.exe, dist/*.zip).FullName)
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Exiles Monitor panel $tag" --generate-notes
          }
